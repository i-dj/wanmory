[project]
name = "wanmory-ml"
version = "0.1.0"
description = "Wanmory machine learning service (face, CLIP, OCR)"
requires-python = ">=3.11"
# 默认只装 ONNX 版要用的：人脸、文字识别、语义搜索都用 onnxruntime 跑，不装 PyTorch（Docker 镜像、树莓派、N100）
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.18",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.20",
  "pillow>=11",
  "tokenizers>=0.20",
  "rapidocr>=3.0",
]

[project.optional-dependencies]
# 有显卡的机器（Apple 芯片 Mac、NVIDIA）：语义搜索用 PyTorch 跑原版模型，快很多。uv sync --extra torch
torch = [
  "torch>=2.5",
  "transformers>=4.46",
  "huggingface-hub>=0.26",
]
# 把 Chinese-CLIP 导出成 ONNX（scripts/export_clip_onnx.py），要和 torch 一起装
export = [
  "onnx>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wanmory_ml"]
