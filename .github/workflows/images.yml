# 构建 Docker 镜像，推到 ghcr.io/<仓库所有者>/（例如 ghcr.io/i-dj/）：
#   wanmory-server：相册程序（内嵌前端页面）+ ExifTool、libvips、FFmpeg
#   wanmory-ml：内置 AI 服务（ONNX 版，不带 PyTorch，模型在网页设置里下载）
# amd64（N100、NAS、PC）和 arm64（树莓派、Apple 芯片上的 Docker）各在自己架构的 GitHub 机器上同时构建，
# 不用模拟器（模拟的 ARM 慢好几倍）；最后合成一个镜像，拉取时自动选对的架构。
# 打 v 开头的标签（git tag v0.1.0 && git push --tags）时发布这个版本和 latest；也可以在 Actions 页面手动运行
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 每个镜像、每种架构一个任务，推上去的只有内容的摘要（digest），还没有标签
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [wanmory-server, wanmory-ml]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: wanmory-server
            context: .
            dockerfile: server/Dockerfile
          - image: wanmory-ml
            context: ml
            dockerfile: ml/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费的 ARM 机器
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: 记下摘要
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # 两种架构都好了：合成一个镜像，打上版本号和 latest
  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [wanmory-server, wanmory-ml]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: 合成多架构镜像
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)
      - name: 看一眼
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
