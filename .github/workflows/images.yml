# 构建 Docker 镜像，推到 ghcr.io/<仓库所有者>/（例如 ghcr.io/i-dj/）：
#   wanmory-server：相册程序（内嵌前端页面）+ ExifTool、libvips、FFmpeg
#   wanmory-ml：内置 AI 服务（ONNX 版，不带 PyTorch，模型在网页设置里下载）
# 同时构建 amd64（N100、NAS、PC）和 arm64（树莓派、Apple 芯片上的 Docker），拉取时自动选对的。
# 打 v 开头的标签（git tag v0.1.0 && git push --tags）时发布这个版本和 latest；也可以在 Actions 页面手动运行
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wanmory-server
            context: .
            dockerfile: server/Dockerfile
          - image: wanmory-ml
            context: ml
            dockerfile: ml/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
