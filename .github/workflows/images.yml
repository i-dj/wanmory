# 构建 Docker 镜像，推到 ghcr.io/<仓库所有者>/（例如 ghcr.io/i-dj/）：
#   wanmory-server：相册程序（内嵌前端页面）+ ExifTool、libvips、FFmpeg
#   wanmory-ml：内置 AI 服务（ONNX 版，不带 PyTorch，模型在网页设置里下载）
# amd64（N100、NAS、PC）和 arm64（树莓派、Apple 芯片上的 Docker）各在自己架构的 GitHub 机器上同时构建，
# 不用模拟器（模拟的 ARM 慢好几倍）；最后合成一个镜像，拉取时自动选对的架构。
# 打 v 开头的标签（git tag v0.1.0 && git push --tags）时发布这个版本和 latest；也可以在 Actions 页面手动运行
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 每个镜像、每种架构一个任务，推上去的只有内容的摘要（digest），还没有标签
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [wanmory-server, wanmory-ml]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: wanmory-server
            context: .
            dockerfile: server/Dockerfile
          - image: wanmory-ml
            context: ml
            dockerfile: ml/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费的 ARM 机器
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 版本号
        # 标签 v0.2.2 → 0.2.2，手动运行（不是标签）时是 dev
        run: echo "VERSION=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo dev)" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          build-args: VERSION=${{ env.VERSION }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: 记下摘要
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # 两种架构都好了：合成一个镜像，打上版本号和 latest
  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [wanmory-server, wanmory-ml]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: 合成多架构镜像
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)
      - name: 看一眼
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest

  # 镜像都推上去了再发布 GitHub Release（设置 → 系统更新从这里看有没有新版本）：说明是 CHANGELOG.md 里这个版本的那一段
  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 摘出这个版本的说明
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag || index($0, tag " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "见提交记录。" > notes.md
          cat notes.md
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
