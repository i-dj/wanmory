# Builds the Docker images and pushes them to ghcr.io/<repository owner>/ (e.g. ghcr.io/i-dj/):
#   wanmory-server: the server (with the web UI embedded) + ExifTool, libvips, FFmpeg
#   wanmory-ml: the built-in AI service (ONNX, no PyTorch; models are downloaded from Settings)
# amd64 (N100, NAS, PC) and arm64 (Raspberry Pi, Docker on Apple silicon) build in parallel on native GitHub runners,
# without emulation (emulated ARM is several times slower), then merge into one multi-arch image.
# Pushing a v* tag (git tag v0.1.0 && git push --tags) publishes that version and latest; it can also be run manually from the Actions page
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # One job per image and architecture; pushes by digest only, without tags yet
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [wanmory-server, wanmory-ml]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: wanmory-server
            context: .
            dockerfile: server/Dockerfile
          - image: wanmory-ml
            context: ml
            dockerfile: ml/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # free ARM runners for public repositories
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        # tag v0.2.2 → 0.2.2; manual runs (not a tag) use dev
        run: echo "VERSION=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo dev)" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          build-args: VERSION=${{ env.VERSION }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Both architectures done: merge into one image tagged with the version and latest
  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [wanmory-server, wanmory-ml]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest

  # Publish the GitHub Release once the images are pushed (Settings → System update checks it for new versions); the notes are this version's section of CHANGELOG.md
  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag || index($0, tag " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See the commit history." > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
