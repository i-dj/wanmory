# Wanmory — self-hosted AI photo library
#
# Quick start:  docker compose up -d   then open http://<host>:8080 (or http://wanmory.local:8080)
# Installer:    curl -fsSL https://wanmory.com/install.sh | bash
#
# Configure via a .env file next to this one (all optional):
#   WANMORY_PORT         Web port (default 8080)
#   WANMORY_DOMAIN       LAN domain announced over mDNS, must end in .local (default wanmory.local)
#   WANMORY_DB_PASSWORD  Database password (set once; it cannot be changed after the first start)
#   WANMORY_TZ           Time zone for photos without one (default Asia/Shanghai)
#   WANMORY_DATA_DIR     Uploads, thumbnails and previews (default ./data)
#   WANMORY_MODELS_DIR   AI models (default ./models)
#   WANMORY_DB_DIR       Database directory (default: the pgdata volume)
#   WANMORY_VERSION      Image tag (default latest)
#   WANMORY_REGISTRY     Image registry (default ghcr.io/i-dj)

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wanmory
      POSTGRES_PASSWORD: ${WANMORY_DB_PASSWORD:-wanmory}
      POSTGRES_DB: wanmory
    volumes:
      # Use a local disk; network shares (SMB/NFS) can corrupt the database
      - ${WANMORY_DB_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wanmory", "-d", "wanmory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: ${WANMORY_REGISTRY:-ghcr.io/i-dj}/wanmory-server:${WANMORY_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://wanmory:${WANMORY_DB_PASSWORD:-wanmory}@postgres:5432/wanmory
      WANMORY_ML_URL: http://ml:3003 # Built-in AI service; a remote one can be set in Settings → AI
      TZ: ${WANMORY_TZ:-Asia/Shanghai}
      WANMORY_MDNS: "off" # Handled by the mdns service below (needs host networking)
      WANMORY_HTTP_PUBLIC_PORT: ${WANMORY_PORT:-8080}
      WANMORY_DOMAIN: ${WANMORY_DOMAIN:-wanmory.local}
      WANMORY_INSTALL_DIR: ${WANMORY_INSTALL_DIR:-}
    ports:
      - "${WANMORY_PORT:-8080}:8080"
    volumes:
      - ${WANMORY_DATA_DIR:-./data}:/data
      # Existing photo folders, scanned every 15 minutes. Mount each under /photos;
      # append :ro to keep the originals read-only. Uncomment to use:
      # - /mnt/nas/photos:/photos/nas:ro
      # - /media/usb/camera:/photos/usb:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Announces the LAN domain over mDNS (multicast requires host networking)
  mdns:
    image: ${WANMORY_REGISTRY:-ghcr.io/i-dj}/wanmory-server:${WANMORY_VERSION:-latest}
    command: ["mdns"]
    network_mode: host
    environment:
      WANMORY_URL: http://127.0.0.1:${WANMORY_PORT:-8080}
      WANMORY_DOMAIN: ${WANMORY_DOMAIN:-wanmory.local}
    healthcheck:
      disable: true
    depends_on:
      - server
    restart: unless-stopped

  # Built-in AI service (CPU). Models are downloaded on demand from Settings → AI
  ml:
    image: ${WANMORY_REGISTRY:-ghcr.io/i-dj}/wanmory-ml:${WANMORY_VERSION:-latest}
    volumes:
      - ${WANMORY_MODELS_DIR:-./models}:/models
    environment:
      WANMORY_MODEL_DIR: /models
      WANMORY_AUTO_DOWNLOAD: "0"
    restart: unless-stopped

volumes:
  pgdata:
